name: Java Maven Build

on:
  push:
    branches: [ main ]   # Change this if your branch is different
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest  # Or use ubuntu-latest if you're not using bat files

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Check Maven Version
      run: mvn -version
      shell: cmd

    - name: Run Unit Tests
      run: mvn test
      shell: cmd

    - name: Build Project (skip tests)
      run: mvn install -DskipTests
      shell: cmd

    - name: Upload WAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: war-artifact
        path: '**/*.war'

