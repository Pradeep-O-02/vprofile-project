name: Java Maven Build

on:
  push:
    branches: [ atom ]  # triggers on 'atom' branch
  pull_request:
    branches: [ atom ]

jobs:
  build:

    runs-on: windows-latest  # Because you're using `bat` commands

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'  # Use Eclipse Temurin for JDK

    - name: Set up Maven
      uses: s4u/setup-maven-action@v1
      with:
        maven-version: '3.9.9'

    - name: Run Unit Tests
      run: mvn test
      shell: cmd

    - name: Build Project
      run: mvn install -DskipTests
      shell: cmd

    - name: Archive WAR Artifact
      uses: actions/upload-artifact@v3
      with:
        name: war-artifact
        path: '**/*.war'

